name: Release and CD

on:
  push:
    branches: [ "main" ]

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, tag, and publish release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python <<'PY'
          import re
          import tomllib
          from pathlib import Path

          pyproject_path = Path("pyproject.toml")
          content = pyproject_path.read_text(encoding="utf-8")
          project = tomllib.loads(content)["project"]
          project_name = project["name"]
          current_version = project["version"]
          match = re.search(
              r"^(\d+)\.(\d+)\.(\d+)(?:\.\d+)*$",
              current_version,
          )
          if match is None:
              raise SystemExit("Unable to find semantic version in pyproject.toml")

          major, minor, patch = map(int, match.groups())
          new_version = f"{major}.{minor}.{patch + 1}"
          version_line_match = re.search(
              rf'(?m)^(\s*version\s*=\s*"){re.escape(current_version)}("\s*)$',
              content,
          )
          if version_line_match is None:
              raise SystemExit("Unable to locate version line in pyproject.toml")
          pyproject_path.write_text(
              content[: version_line_match.end(1)]
              + new_version
              + content[version_line_match.start(2) :],
              encoding="utf-8",
          )

          uv_lock_path = Path("uv.lock")
          uv_lock_content = uv_lock_path.read_text(encoding="utf-8")
          uv_lock_match = re.search(
              rf'(?ms)(\[\[package\]\]\s+name = "{re.escape(project_name)}"\s+version = ")(\d+\.\d+\.\d+)(")',
              uv_lock_content,
          )
          if uv_lock_match is None:
              raise SystemExit("Unable to find project version in uv.lock")

          uv_lock_path.write_text(
              uv_lock_content[: uv_lock_match.start(2)]
              + new_version
              + uv_lock_content[uv_lock_match.end(2) :],
              encoding="utf-8",
          )
          print(new_version, end="")
          PY
          )"

          {
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
          } >> "${GITHUB_OUTPUT}"

          git add pyproject.toml uv.lock
          git commit -m "chore: release v${VERSION}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          git tag "v${VERSION}"
          git push origin HEAD:main --follow-tags
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes

  check-and-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run checks (lint, format)
        run: |
          ./scripts/lint
          ./scripts/format --check

      - name: Run tests with coverage
        run: ./scripts/test

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
